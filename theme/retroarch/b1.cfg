# Cles RetroArch 1.8.4 posees par le theme B1 (menus uniquement).
# apply.sh remplace ces cles dans retroarch.cfg ; restore.sh remet les valeurs d'origine.
menu_driver = "xmb"
menu_wallpaper = "/usr/share/snes_usa_b1/retroarch/b1_wallpaper.png"
menu_wallpaper_opacity = "1.000000"
menu_dynamic_wallpaper_enable = "false"
menu_shader_pipeline = "0"
xmb_font = "/usr/share/snes_usa_b1/retroarch/Jost-Medium.ttf"
xmb_shadows_enable = "false"
